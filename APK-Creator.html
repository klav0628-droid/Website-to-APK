<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534"><title>APK Creator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 35px #0001}.hero{text-align:center;padding:8px 0 18px}.hero .ico{font-size:48px}.hero h1{margin:5px 0;font-size:28px}.sub{color:#667085;line-height:1.5}.field{margin:17px 0}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}button,.download{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{width:100%;background:#166534;color:#fff}.github{width:100%;background:#111827;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.logo{width:100px;height:100px;border:2px dashed #cbd5e1;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px}.logo img{max-width:100%;max-height:100%;object-fit:contain}.hint{font-size:13px;color:#667085;margin-top:7px;line-height:1.4}.status{margin-top:18px;padding:14px;border-radius:13px;background:#f8fafc;white-space:pre-wrap;line-height:1.45}.ok{background:#ecfdf3;color:#166534}.err{background:#fff1f2;color:#9f1239}.hidden{display:none}.download{display:block;text-align:center;text-decoration:none;background:#166534;color:#fff;margin-top:12px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.mini{font-size:12px;color:#667085;text-align:center;margin-top:18px}</style>
</head><body><div class="wrap"><div class="card">
<div class="hero"><div class="ico">📱</div><h1>Website → Android APK</h1><div class="sub">Logo, App Name और Website URL डालें। GitHub से सुरक्षित तरीके से APK बनाएं।</div></div>
<div id="connect"><button class="github" onclick="connectGitHub()">🔐 Connect GitHub</button><div class="hint">पहली बार सिर्फ GitHub authorization देना होगा। Personal Access Token डालने की जरूरत नहीं है।</div></div>
<div id="app" class="hidden">
<div class="field"><label>App Name</label><input id="name" placeholder="Hostel Booker" maxlength="40"></div>
<div class="field"><label>Website URL</label><input id="url" type="url" placeholder="https://example.com"></div>
<div class="field"><label>Logo</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><div class="logo"><img id="preview" alt="Logo"></div></div>
<button class="primary" onclick="generate()">🚀 Generate APK</button>
<div class="row"><button class="secondary" onclick="logout()">Disconnect GitHub</button><button class="secondary" onclick="window.open('https://github.com/klav0628-droid/Website-to-APK/actions','_blank')">Builds</button></div>
</div>
<div id="status" class="status">Ready.</div><div class="mini">GitHub OAuth + secure backend • आपका Client Secret browser में नहीं रखा जाता</div>
</div></div>
<script>
const BACKEND_URL='https://apk-creator-backend.vercel.app';
const $=id=>document.getElementById(id);
function setStatus(t,c=''){ $('status').textContent=t; $('status').className='status '+c; }
function connectGitHub(){ if(!BACKEND_URL.startsWith('https://')) return setStatus('Backend URL configure नहीं है।','err'); location.href=BACKEND_URL+'/api/login'; }
async function session(){try{const r=await fetch(BACKEND_URL+'/api/session',{credentials:'include'});return r.ok}catch{return false}}
async function boot(){if(new URLSearchParams(location.search).get('connected'))history.replaceState({},'',location.pathname);if(await session()){ $('connect').classList.add('hidden');$('app').classList.remove('hidden');setStatus('✅ GitHub connected. अब APK बनाइए।','ok')}else setStatus('Ready. पहले Connect GitHub दबाएँ।')}
function logout(){fetch(BACKEND_URL+'/api/logout',{credentials:'include'}).finally(()=>location.reload())}
$('logo').addEventListener('change',()=>{const f=$('logo').files[0];if(f)$('preview').src=URL.createObjectURL(f)});
function image64(file){return new Promise((resolve,reject)=>{const fr=new FileReader(),img=new Image();fr.onload=()=>{img.onload=()=>{const max=512,c=document.createElement('canvas');c.width=max;c.height=max;const x=c.getContext('2d'),s=Math.min(max/img.width,max/img.height),w=img.width*s,h=img.height*s;x.clearRect(0,0,max,max);x.drawImage(img,(max-w)/2,(max-h)/2,w,h);resolve(c.toDataURL('image/png').split(',')[1])};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
async function generate(){try{const name=$('name').value.trim(),url=$('url').value.trim(),file=$('logo').files[0];if(!name)return setStatus('App Name डालें।','err');if(!/^https?:\/\//i.test(url))return setStatus('Website URL http:// या https:// से शुरू होना चाहिए।','err');if(!file)return setStatus('Logo चुनें।','err');setStatus('Logo तैयार हो रहा है...');const iconBase64=await image64(file);setStatus('GitHub में APK build शुरू कर रहा हूँ...');const r=await fetch(BACKEND_URL+'/api/generate',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,url,iconBase64})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Generation failed');setStatus('⏳ APK build चल रहा है...\nकृपया page बंद न करें।');for(let i=0;i<60;i++){await new Promise(x=>setTimeout(x,5000));const s=await fetch(BACKEND_URL+'/api/status?commit='+encodeURIComponent(d.commit),{credentials:'include'});const j=await s.json();if(j.status==='success'){setStatus('✅ APK तैयार हो गया!','ok');const a=document.createElement('a');a.className='download';a.href=j.url;a.target='_blank';a.textContent='⬇️ Download APK';$('status').appendChild(document.createElement('br'));$('status').appendChild(a);return}if(j.status==='failed')throw new Error('Build failed. GitHub Actions में error देखें।')}setStatus('Build अभी चल रहा है। GitHub Actions में status देखें।','ok')}catch(e){setStatus('Error: '+e.message,'err')}}
boot();
</script></body></html>
