<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website to APK Creator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}h1{margin:0 0 8px}.sub{color:#667085;margin-bottom:24px}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{border:0;border-radius:11px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{width:100%;background:#166534;color:white;margin-top:8px}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2;color:#be123c}.row{display:flex;gap:10px;flex-wrap:wrap}.logo{width:100px;height:100px;border:2px dashed #cbd5e1;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px}.logo img{max-width:100%;max-height:100%;object-fit:contain}.hint{font-size:13px;color:#667085;margin-top:6px}.status{margin-top:18px;padding:14px;border-radius:12px;background:#f8fafc;white-space:pre-wrap}.ok{background:#ecfdf3;color:#166534}.err{background:#fff1f2;color:#9f1239}.small{font-size:13px}.hidden{display:none}a{color:#175cd3;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🌐 Website → Android APK</h1>
<div class="sub">सिर्फ Logo + App Name + Website URL भरें और APK GitHub Repository में बन जाएगा।</div>

<div id="connectBox">
<div class="field"><label>पहली बार GitHub Token</label><input id="token" type="password" placeholder="github_pat_..."><div class="hint">Token सिर्फ आपके browser में save होगा और GitHub API को भेजा जाएगा। इसे किसी को share न करें।</div></div>
<button class="secondary" onclick="saveToken()">GitHub Connect / Save</button>
</div>

<div id="appBox" class="hidden">
<div class="field"><label>App Name</label><input id="appName" placeholder="Hostel Booker"></div>
<div class="field"><label>Website URL</label><input id="siteUrl" type="url" placeholder="https://example.com"></div>
<div class="field"><label>Logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="logo"><img id="preview" alt="Logo preview"></div><div class="hint">PNG/JPG/WEBP logo चुनें। Tool इसे APK icon के लिए PNG में बदलेगा।</div></div>
<button class="primary" onclick="generateApk()">🚀 Generate APK</button>
<div class="row" style="margin-top:10px"><button class="danger" onclick="logout()">GitHub Token हटाएँ</button><button class="secondary" onclick="openActions()">Build/Actions खोलें</button></div>
</div>
<div id="status" class="status">Ready.</div>
</div></div>
<script>
const OWNER='klav0628-droid', REPO='Website-to-APK', BRANCH='main';
const $=id=>document.getElementById(id);
function api(path, opts={}){const token=localStorage.getItem('wa_token');return fetch('https://api.github.com'+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}})}
function saveToken(){const t=$('token').value.trim();if(!t)return alert('GitHub token डालें।');localStorage.setItem('wa_token',t);showApp();setStatus('GitHub connected. अब App Name, Website URL और Logo भरें।','ok')}
function logout(){localStorage.removeItem('wa_token');location.reload()}
function showApp(){ $('connectBox').classList.add('hidden'); $('appBox').classList.remove('hidden') }
function openActions(){window.open(`https://github.com/${OWNER}/${REPO}/actions`,'_blank')}
function setStatus(s,c=''){ $('status').textContent=s; $('status').className='status '+c }
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'webapp'}
function blob64(s){return btoa(unescape(encodeURIComponent(s)))}
async function imageToBase64(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const c=document.createElement('canvas'),max=512;c.width=max;c.height=max;const x=c.getContext('2d');x.clearRect(0,0,max,max);const scale=Math.min(max/img.width,max/img.height);const w=img.width*scale,h=img.height*scale;x.drawImage(img,(max-w)/2,(max-h)/2,w,h);resolve(c.toDataURL('image/png').split(',')[1])};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
$('logoFile').addEventListener('change',()=>{const f=$('logoFile').files[0];if(f){$('preview').src=URL.createObjectURL(f)}})
async function getJson(path){const r=await api(path);if(!r.ok)throw new Error(await r.text());return r.json()}
async function postJson(path,body){const r=await api(path,{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function putJson(path,body){const r=await api(path,{method:'PATCH',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function generateApk(){
 try{
  const name=$('appName').value.trim(), url=$('siteUrl').value.trim(), file=$('logoFile').files[0];
  if(!name||!url||!/^https?:\\/\\//i.test(url))return setStatus('App Name और valid https:// या http:// Website URL डालें।','err');
  if(!file)return setStatus('Logo चुनें।','err');
  setStatus('1/5 Logo तैयार हो रहा है...');
  const icon=await imageToBase64(file);
  const config=`APP_NAME=${name}\\nWEBSITE_URL=${url}\\n`;
  setStatus('2/5 GitHub branch पढ़ रहा हूँ...');
  const ref=await getJson(`/repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}`);const parent=ref.object.sha;
  const commit=await getJson(`/repos/${OWNER}/${REPO}/git/commits/${parent}`);const baseTree=commit.tree.sha;
  setStatus('3/5 Logo और settings GitHub में भेज रहा हूँ...');
  const b1=await postJson(`/repos/${OWNER}/${REPO}/git/blobs`,{content:config,encoding:'utf-8'});
  const b2=await postJson(`/repos/${OWNER}/${REPO}/git/blobs`,{content:icon,encoding:'base64'});
  const tree=await postJson(`/repos/${OWNER}/${REPO}/git/trees`,{base_tree:baseTree,tree:[
   {path:'app-config.properties',mode:'100644',type:'blob',sha:b1.sha},
   {path:'app-icon.base64',mode:'100644',type:'blob',sha:b2.sha}
  ]});
  const c=await postJson(`/repos/${OWNER}/${REPO}/git/commits`,{message:`Generate APK: ${name}`,tree:tree.sha,parents:[parent]});
  await putJson(`/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}`,{sha:c.sha,force:false});
  setStatus('4/5 APK build शुरू हो गया है...\\nकुछ समय लग सकता है।');
  let run=null;
  for(let i=0;i<40;i++){
   await new Promise(r=>setTimeout(r,5000));
   const data=await getJson(`/repos/${OWNER}/${REPO}/actions/runs?branch=${BRANCH}&event=push&per_page=10`);
   run=data.workflow_runs.find(x=>x.head_sha===c.sha) || data.workflow_runs[0];
   if(run && run.status==='completed')break;
  }
  if(!run||run.conclusion!=='success'){
    setStatus('Build सफल नहीं हुआ। GitHub Actions खोलकर error देखें:\n'+`https://github.com/${OWNER}/${REPO}/actions`,'err');return;
  }
  setStatus('5/5 APK तैयार है। Release ढूँढ रहा हूँ...');
  const rel=await getJson(`/repos/${OWNER}/${REPO}/releases?per_page=10`);
  const r=rel.find(x=>x.tag_name===`build-${run.run_number}`)||rel[0];
  if(r&&r.assets&&r.assets.length){const a=r.assets.find(x=>x.name.toLowerCase().endsWith('.apk'))||r.assets[0];setStatus(`✅ APK तैयार हो गया!\\n\\nApp: ${name}\\nBuild: #${run.run_number}\\n\\nनीचे Download APK दबाएँ।`,'ok');const btn=document.createElement('a');btn.href=a.browser_download_url;btn.target='_blank';btn.textContent='⬇️ Download APK';btn.style.display='inline-block';btn.style.marginTop='12px';btn.style.padding='13px 18px';btn.style.background='#166534';btn.style.color='white';btn.style.borderRadius='11px';btn.style.textDecoration='none';$('status').appendChild(document.createElement('br'));$('status').appendChild(btn)}
  else setStatus('APK build successful है। GitHub Releases में APK मिलेगा:\n'+`https://github.com/${OWNER}/${REPO}/releases`,'ok');
 }catch(e){console.error(e);setStatus('Error:\n'+e.message+'\\n\\nToken permissions और GitHub repository check करें।','err')}
}
if(localStorage.getItem('wa_token'))showApp();
</script>
</body></html>
