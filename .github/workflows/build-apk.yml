name: Build Website APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-config.properties'
      - 'app-icon.base64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app-icon.base64 > app/src/main/res/drawable/app_icon.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Name APK
        shell: bash
        run: |
          APP_NAME=$(grep '^APP_NAME=' app-config.properties | cut -d'=' -f2-)
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '-' | tr -cd '[:alnum:]_-')
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${SAFE_NAME}.apk"
          echo "APK_NAME=${SAFE_NAME}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Website-APK
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "app/build/outputs/apk/debug/${{ env.APK_NAME }}" \
            --title "${{ env.APK_NAME }}" \
            --notes "Automatically generated Website-to-APK build."
